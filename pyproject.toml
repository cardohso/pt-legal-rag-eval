[project]
name = "pt-legal-rag-eval"
version = "0.1.0"
description = "Independent evaluation of AMALIA, EuroLLM, Gemma and Qwen for RAG over Portuguese labour law."
readme = "README.md"
license = "MIT"
authors = [{ name = "João Pedro Cardoso" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "goldpass @ git+https://github.com/cardohso/goldpass@b10c0a923a6f8d8a8b2edad8b363d31be47f872a",
]

[project.optional-dependencies]
# Heavy, only needed to compute real embeddings; CI and tests never install it.
retrieval = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ptlegal_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the fixture imitates long lines of the real page
"tests/test_ingest.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
